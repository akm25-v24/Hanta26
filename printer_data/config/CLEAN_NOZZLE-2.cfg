# this is AI generated macro
[gcode_macro CLEAN_NOZZLE]
description: "Cleans the nozzle by wiping on a brush/pad"
gcode:
    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

    M117 Cleaning nozzle...
    ; Heat to gentle cleaning temp
    M104 S150
    M109 S150

    G90
    ; Lift a bit to be safe
    G1 Z10 F6000
    ; Go to brush / pad area
    G1 X190 Y300 F6000
    G1 Z7.9 F3000

    ; Wiping passes – adjust X/Y if needed
    G1 X161 Y300 F6000
    G1 X201 Y300 F6000
    G1 X161 Y300 F6000
    G1 X201 Y300 F6000
    G1 X161 Y300 F6000
    G1 X201 Y300 F6000
    G1 X161 Y300 F6000
    G1 X201 Y300 F6000
    G1 X161 Y300 F6000
    G1 X201 Y300 F6000

    ; Lift away from brush
    G1 Z10 F6000

    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE