[include mainsail.cfg]

# host MCU service is preinstalled and ready to use with:
[mcu CB1]
serial: /tmp/klipper_host_mcu

# This file contains common pin mappings for the Micron R1 with BTT M8P V2.0 and BTT EBB36 V1.2 CAN
# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON 2.4 250/300/350mm Leviathan V1.1 + Nitehawk-SB config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section


# Enable object exclusion
[exclude_object]
# Enable arcs support
[gcode_arcs]
resolution: 0.1
[include bedfans.cfg]
[skew_correction]
[include CLEAN_NOZZLE-2.cfg]




[mcu]
canbus_uuid: c18a91f37bb0
##--------------------------------------------------------------------
[mcu EBBCan]
canbus_uuid: 2eea74bd9313

[printer]
kinematics: corexy
max_velocity: 200  
max_accel: 5000    			#This can be adjusted after you run Input Shaper calibration
max_z_velocity: 25 			
max_z_accel: 350
square_corner_velocity: 5

#######################
# Temperature Sensors #
#######################

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

[temperature_sensor EBB36]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 100

[temperature_sensor Electronic_temp]
## Dock Temperature - T1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA7
min_temp: 0
max_temp: 100
gcode_id: Electronics_th

[temperature_sensor chamber_temp]
sensor_type: Generic 3950
sensor_pin: PC4
min_temp: 0
max_temp: 100
gcode_id: chamber_th



#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTO1
##  Endstop connected to EBB36
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 32
rotation_distance: 32
full_steps_per_rotation:200 #400 for 0.9 deg steppers
endstop_pin: EBBCan:PB6
position_endstop: 0
position_max: 235
##--------------------------------------------------------------------

position_endstop: 173
position_max: 173
position_min: 0

##--------------------------------------------------------------------
homing_speed: 50   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_x]
cs_pin: PC13
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
##diag1_pin: PF4
sense_resistor: 0.075
run_current: 0.900
stealthchop_threshold: 999999

##  A Stepper - Right
##  Connected to MOTO2
##  Endstop connected to Y-ENDSTOP
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 32
rotation_distance: 32
full_steps_per_rotation:200 #400 for 0.9 deg steppers 
endstop_pin: ^PF3
position_endstop: 0
position_max: 235
##--------------------------------------------------------------------

position_endstop: 190
position_max: 190
position_min: 0

##--------------------------------------------------------------------
homing_speed: 50  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_y]
cs_pin: PE3
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
##diag1_pin: PF3
sense_resistor: 0.075
run_current: 0.900
stealthchop_threshold: 999999

#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to Moto 3a
##  Endstop connected to Probe
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
endstop_pin:  probe:z_virtual_endstop
#position_endstop: 0
position_max: 165
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
##--------------------------------------------------------------------

position_max: 165

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z]
uart_pin: PB9
##diag_pin: PF2
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z1 Stepper - Rear Left
##  Connected to Moto 5
[stepper_z1]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z1]
uart_pin: PG14
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z2 Stepper - Rear Right
##  Connected to MOTO 6
[stepper_z2]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32


##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z2]
uart_pin: PG10
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 999999

##  Z3 Stepper - Front Right
##  Connected to MOTO 7
[stepper_z3]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PD5
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 999999

#####################################################################
#   Extruder
#####################################################################

##  Connected to STEPPER EBB36
##  Heater - HEATER
##  Thermistor - TH0
[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
microsteps: 16
rotation_distance: 46.240256 #47.088 
gear_ratio: 9:1
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_velocity: 40
max_extrude_only_accel: 2500
max_extrude_cross_section: 50
max_extrude_only_distance: 400
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 320
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.068
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040

##  E0 on MOTOR6
##  Connected to STEPPER 4

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.650
stealthchop_threshold: 999999

#--------------------------------------------------------------------
[verify_heater extruder]             # Heater block temperature tolerance configuration
max_error: 120                       # Maximum error
check_gain_time: 120                 # Tolerance time
hysteresis: 50                       # Tolerance temperature
heating_gain: 2                      # Heating gain

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
##  SSR Pin - HEATBED
##  Thermistor - THB
heater_pin: PA1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PB1
pullup_resistor: 2200
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.80
min_temp: 0
max_temp: 125
#control: pid
#pid_kp: 41.312
#pid_ki: 1.005
#pid_kd: 424.480

[verify_heater heater_bed]
# Allow more time for a slow-heating bed (default is 60s)
check_gain_time: 120

# Require a 2 °C rise in that time (default is 2°C)
heating_gain: 2

# Permit a larger cumulative error before shutdown
# (°C·sec above the allowed hysteresis band; default 120)
max_error: 500

#####################################################################
#   Probe
#####################################################################
  
[probe]
##  Boop Probe
##  Connected to Z-PROBE
##  This probe is not used for Z height, only Quad Gantry Leveling
pin: ^EBBCan: PB7
x_offset: 0
y_offset: 0
#z_offset: 0
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}
    
    {% if TARGET_TEMP > PROBE_TEMP %}
    { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
    M109 S{ PROBE_TEMP }
    {% else %}
    {% if ACTUAL_TEMP > MAX_TEMP %}
    { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
    {% endif %}
    {% endif %}
    

[homing_override]
axes: xyz
set_position_z: 0
gcode:
   G90
   G0 Z5 F600
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  {% if home_all or 'X' in params %}
    G28 X
    M117 "HOME X"
  {% endif %}

  {% if home_all or 'Y' in params %}
    G91
    G1 X-80 F5000
    G28 Y
    M117 "HOME Y"
  {% endif %}

  {% if home_all or 'Z' in params %}
    G90
    G1 X87.5 Y90 F5000
    G28 Z
    M117 "HOME Z"
    G1 Z20
  {% endif %}

########
# ADXL #
########

[adxl345]
cs_pin: EBBCan:PB12
spi_software_sclk_pin: EBBCan:PB10
spi_software_mosi_pin: EBBCan:PB11
spi_software_miso_pin: EBBCan:PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 150
probe_points:
    87,90,20
max_freq: 150

###############
# Fan Control #
###############

[fan]
##	Part Cooling Fan
pin: EBBCan:PA1  
cycle_time: 0.00003                  # Cycle time
hardware_pwm: false              # hardware pwm

[fan]
##	Part Cooling Fan
pin: EBBCan:PA1  
cycle_time: 0.00003                  # Cycle time
hardware_pwm: false              # hardware pwm

[heater_fan hotend_fan]
pin: EBBCan:PA0
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5
max_power: 1.0
#tachometer_pin: thb:HE_TACH  #Uncomment for Tach on NH36

[controller_fan controller_fan]
pin: PF7
max_power:0.5
kick_start_time: 0.5
fan_speed: 1.0
idle_speed: 0.5

[controller_fan controller_fan2]
pin: PF8
max_power:0.5
kick_start_time: 0.5
fan_speed: 1.0
idle_speed: 0.5

#################
# Carbon Filter #
#################

[fan_generic filter]
pin: PF9

[delayed_gcode filter_off]
gcode:
     SET_FAN_SPEED FAN=filter SPEED=0

[gcode_macro TOGGLE_FILTER]
 gcode:
     {% if printer['fan_generic filter'].speed > 0 %}
       SET_FAN_SPEED FAN=filter SPEED=0
     {% else %}
       SET_FAN_SPEED FAN=filter SPEED=1
     {% endif %}


###############
# LED Control #
###############

## Chamber Lighting
[output_pin caselight]
pin: PA3
pwm:true
shutdown_value: 0
value:1
cycle_time: 0.01

[neopixel hotend_rgb]
pin: EBBCan:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.9
initial_GREEN: 0.1
initial_BLUE: 0.1

#########################################
# Homing and Gantry Adjustment Routines #
#########################################

[idle_timeout]
timeout: 1800

[quad_gantry_level]
speed: 100
horizontal_move_z: 8
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#--------------------------------------------------------------------

##  Gantry Corners for 180 Build
gantry_corners:
   -60.2,-10.4
   244.1,234.5
##  Probe points
points:
  40,15
  40,165
  135,165
  135,15

#--------------------------------------------------------------------

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 15,15
mesh_max: 165,165
probe_count: 5,5
algorithm: bicubic
fade_start: 0.6
fade_end: 10
##########################################
#
# OrcaSlicer:
# M104 S0 ; Stops OrcaSlicer from sending temp waits separately
# M140 S0
# PRINT_START EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature]
#
##########################################
[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default(0)|float %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  SET_DISPLAY_TEXT MSG="Print Starting: Hotend:{target_extruder}c, Bed:{target_bed}c, Chamber:{target_chamber}c"

  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  G28                                                   # Full home (XYZ)
  G90                                                   # Absolute positioning

  PARK                                                  # Go to center of the bed
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"

  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak and toggle filter.
  {% if params.BED|int > 90 %}
    M106 S255                                           # Turn on the part cooling fan
    TOGGLE_FILTER                                       # Turn on the filter
    M140 S{target_bed}                                  # Set bed temp
    #HEATSOAK_CHAMBER CHAMBER_TEMP={target_chamber}
  {% endif %}

  M190 S{target_bed}                                    # Wait for bed temp

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  SET_DISPLAY_TEXT MSG="Hotend: 150c"
  M109 S150

  CLEAN_NOZZLE
  
  SET_DISPLAY_TEXT MSG="Leveling"
  QUAD_GANTRY_LEVEL
  G28 Z

  # Load saved bed mesh
  BED_MESH_PROFILE LOAD=Default100

  # Heat hotend to target temp
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  PARK
  M107
  M109 S{target_extruder}

  # Purge line at front-left corner
  SET_DISPLAY_TEXT MSG="Printer goes brr"
  G90
  G92 E0
  G1 X5 Y5 Z0.3 F6000
  G1 X55 Y5 E12 F1000
  G1 X45 Y5 F3000
  G92 E0
  SKEW_PROFILE LOAD=Califlower

  
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SET_SKEW CLEAR=1
    {% set th = printer.toolhead %}
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X{th.axis_maximum.x//2} Y{th.axis_maximum.y} F3600            ; park nozzle at rear
    
    ##  Uncomment for bed mesh (1 of 3 for bed mesh)
    #BED_MESH_CLEAR
    
    ##  Uncomment if you have a filter.
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=180

##########
# MACROS #
##########

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30  

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X87.5 Y90 Z30 F3600
    

[gcode_macro PRIME]
gcode:
  {% set x_mid = printer.toolhead.axis_maximum.x|float / 2 %}
  G0 X{x_mid - 50} Y4 F10000                           # Go to starting point
  G0 Z0.4                                               # Raise Z to 0.4
  G91                                                   # Incremental positioning 
  G1 X100 E20 F1000                                     # Primeline
  G90  

[gcode_macro PRINT_TEST_CUBE]
variable_pla_he_temp: 220
variable_pla_bed_temp: 60
variable_abs_he_temp: 265
variable_abs_bed_temp: 110
variable_abs_chamber_temp: 45
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin PRINT TEST CUBE"
    RESPOND TYPE=command MSG="action:prompt_text Which material are you using?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button ABS|_PRINT_CUBE_START MATERIAL=ABS"
    RESPOND TYPE=command MSG="action:prompt_button PLA|_PRINT_CUBE_START MATERIAL=PLA"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _PRINT_CUBE_START]
gcode:
      RESPOND TYPE=command MSG="action:prompt_end"
      {% set MATERIAL = params.MATERIAL|default("XXX")|string %}
      RESPOND MSG="Printing Test Cube in {MATERIAL}"
      {% if MATERIAL == "ABS" %}
         {% set EXTRUDER = printer["gcode_macro PRINT_TEST_CUBE"].abs_he_temp%}
         {% set BED = printer["gcode_macro PRINT_TEST_CUBE"].abs_bed_temp%}
      {% elif MATERIAL == "PLA" %}
         {% set EXTRUDER = printer["gcode_macro PRINT_TEST_CUBE"].pla_he_temp%}
         {% set BED = printer["gcode_macro PRINT_TEST_CUBE"].pla_bed_temp%}
         {% set CHAMBER = 0 %}
      {% else %}
      {% endif %}

   PRINT_START EXTRUDER={EXTRUDER} BED={BED} CHAMBER={CHAMBER}
   SDCARD_PRINT_FILE FILENAME=".micron_test_cube.gcode"

